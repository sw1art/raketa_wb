name: checkstock

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-checkstock}
      POSTGRES_USER: ${POSTGRES_USER:-checkstock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-checkstock}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-checkstock} -d ${POSTGRES_DB:-checkstock}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [checkstock]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-checkstock}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-checkstock}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [checkstock]

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-checkstock}:${POSTGRES_PASSWORD:-checkstock}@postgres:5432/${POSTGRES_DB:-checkstock}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-checkstock}:${RABBITMQ_PASSWORD:-checkstock}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: checkstock.events
      RABBITMQ_QUEUE: checkstock.events.queue
      RABBITMQ_DLQ: checkstock.events.dlq
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      WB_API_TOKEN: ${WB_API_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [checkstock]

  outbox-worker:
    build: ./backend
    command: ["python", "-m", "worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-checkstock}:${POSTGRES_PASSWORD:-checkstock}@postgres:5432/${POSTGRES_DB:-checkstock}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-checkstock}:${RABBITMQ_PASSWORD:-checkstock}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: checkstock.events
      RABBITMQ_QUEUE: checkstock.events.queue
      RABBITMQ_DLQ: checkstock.events.dlq
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      backend:
        condition: service_healthy
    networks: [checkstock]

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks: [checkstock]

volumes:
  pgdata:
  rabbitdata:

networks:
  checkstock:
    driver: bridge
