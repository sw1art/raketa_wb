[project]
name = "checkstock"
version = "1.0.0"
description = "CheckStock — управление складскими остатками, резервами и отправками FBS/FBO"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "aio-pika>=9.4.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
checkstock-api = "main:main"
checkstock-seed = "seed:main"
checkstock-worker = "worker:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main", "seed", "worker"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "BLE"]
# B008: FastAPI's `Depends(...)` in argument defaults is the documented idiom.
# BLE001: reconnect/retry loops intentionally catch broadly and always log.
# RUF001/RUF002/RUF003: legitimate Russian (Cyrillic) text in docstrings/strings/comments.
ignore = ["B008", "BLE001", "RUF001", "RUF002", "RUF003"]
